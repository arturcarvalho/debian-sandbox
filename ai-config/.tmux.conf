set -g mouse on
set -g focus-events on
set -g xterm-keys on
set -g extended-keys on

set -g status-interval 5
set -g status-right-length 60
set -g status-style "bg=#1d2021,fg=#b8bb26"
set -g status-right-style "bg=#1d2021,fg=#b8bb26"
set -g status-right " #h  MEM #(free -h | awk '/^Mem:/{print \$3\"/\"\$2}') "
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
